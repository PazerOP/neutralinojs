name: Test suite

on:
  push:
    branches: [main, master, pazer/main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  BUILD_CLIENT: |
    npm i -g @electron/asar
    cd ..
    git clone https://github.com/neutralinojs/neutralino.js.git
    cd neutralino.js
    npm ci
    cd ../neutralinojs
    ./scripts/make_res_neu.sh

jobs:
  skip-check:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
    - id: skip_check
      uses: fkirc/skip-duplicate-actions@v5
      with:
        concurrent_skipping: 'outdated_runs'
        cancel_others: 'true'

  build-linux:
    needs: skip-check
    if: needs.skip-check.outputs.should_skip != 'true'
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        arch: [x64, arm64, armhf]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      if: ${{ matrix.arch == 'x64' }}
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install Libraries
      if: ${{ matrix.arch == 'x64' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y -f \
        libgtk-3-dev \
        libwebkit2gtk-4.0-37 \
        libayatana-appindicator3-1 \
        xvfb \
        xclip

    - name: Build
      if: ${{ matrix.arch == 'x64' }}
      run: |
        ./scripts/bz.py
        chmod +x ./bin/neutralino-linux_x64
        
    - name: Build
      if: ${{ matrix.arch == 'arm64' || matrix.arch == 'armhf' }}
      uses: uraimo/run-on-arch-action@v3
      id: build-package
      with:
        arch: ${{ matrix.arch == 'arm64' && 'aarch64' || 'armv7' }}
        distro: ubuntu20.04
        install: |
          apt-get update
          apt-get install -y -f \
          libgtk-3-dev \
          libwebkit2gtk-4.0-dev \
          git \
          python3 \
          g++ \
          pkg-config

        githubToken: ${{ github.token }}

        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          ./scripts/bz.py

    - name: Setup Spec Requirements (Build client)
      if: ${{ matrix.arch == 'x64' }}
      run: |
        echo "$BUILD_CLIENT" > build_client.sh
        chmod +x build_client.sh
        ./build_client.sh

    - name: Setup Spec Requirements (Setup extensions)
      if: ${{ matrix.arch == 'x64' }}
      working-directory: ./bin/extensions/sampleextension
      run: npm ci

    - name: Run Spec
      if: ${{ matrix.arch == 'x64' }}
      working-directory: ./spec
      run: |
        npm ci
        xvfb-run npm run test


  build-windows:
    needs: skip-check
    if: needs.skip-check.outputs.should_skip != 'true'
    runs-on: windows-2022
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Build
      run: python ./scripts/bz.py
      shell: cmd

    - name: Setup Spec Requirements (Build client)
      shell: bash
      run: |
        echo "$BUILD_CLIENT" > build_client.sh
        chmod +x build_client.sh
        ./build_client.sh

    - name: Setup Spec Requirements (Setup extensions)
      working-directory: ./bin/extensions/sampleextension
      run: npm ci

    - name: Run Spec
      working-directory: ./spec
      run: |
        npm ci
        npm run test

  build-darwin:
    needs: skip-check
    if: needs.skip-check.outputs.should_skip != 'true'
    runs-on: macos-14
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Build
      run: |
        ./scripts/bz.py --target_arch arm64
        chmod +x ./bin/neutralino-mac_arm64

    - name: Setup Spec Requirements (Build client)
      run: |
        echo "$BUILD_CLIENT" > build_client.sh
        chmod +x build_client.sh
        ./build_client.sh

    - name: Setup Spec Requirements (Setup extensions)
      working-directory: ./bin/extensions/sampleextension
      run: npm ci

    - name: Run Spec
      working-directory: ./spec
      run: |
        npm ci
        npm run test
